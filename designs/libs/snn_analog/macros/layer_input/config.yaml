meta:
  version: 3
  flow: Classic

DESIGN_NAME: layer_input

VERILOG_FILES:
  - dir::layer_input.v

FP_PIN_ORDER_CFG: dir::pin.cfg

# # --- Absolute SDC Paths ---
# PNR_SDC_FILE: /foss/designs/libs/snn_analog/lif/neurona_lvs.sdc
# SIGNOFF_SDC_FILE: /foss/designs/libs/snn_analog/lif/neurona_lvs.sdc

# --- Floorplanning ---
FP_SIZING: absolute 
DIE_AREA:
  - 0
  - 0
  - 100
  - 400

# --- Power Grid (PDN) ---
VDD_NETS:
  - vdd
GND_NETS:
  - vss

PDN_ENABLE_RAILS: false
PDN_MULTILAYER: true
PDN_VWIDTH: 1.2
PDN_HWIDTH: 1.2
PDN_VSPACING: 2
PDN_HSPACING: 2
PDN_VPITCH: 90
PDN_HPITCH: 110
PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 1.5
PDN_CORE_RING_HWIDTH: 1.5
PDN_CORE_RING_VSPACING: 1.5
PDN_CORE_RING_HSPACING: 1.5
PDN_VOFFSET: 20.0
PDN_HOFFSET: 55.0
# Connect Macro Power/Ground Pins to Global Net
PDN_MACRO_CONNECTIONS:
  - "x1 vdd vss vdd vss"
  - "x2 vdd vss vdd vss"
  - "x3 vdd vss vdd vss"
  - "x4 vdd vss vdd vss"

# --- Blackbox & Analog Optimization (Valid LibreLane Flags) ---
PL_TIMING_DRIVEN: false            # Disables OpenROAD timing-driven placement
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_REPAIR_DESIGN: false
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false
RUN_HEURISTIC_DIODE_INSERTION: false
RUN_FILL_INSERTION: false
RUN_TAP_ENDCAP_INSERTION: false
ERROR_ON_PDN_VIOLATIONS: false

# --- Direct LEF/GDS Blackbox Include ---
EXTRA_LEFS:
  - /foss/designs/libs/snn_analog/lif/neurona_lvs.lef
EXTRA_GDS:
  - /foss/designs/libs/snn_analog/lif/neurona_lvs.gds

# --- Routing (GF180MCU) ---
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
MAGIC_ZEROIZE_ORIGIN: false
ERROR_ON_MAGIC_DRC: false
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true
MAGIC_EXT_UNIQUE: notopports


#MAGIC_GDS_FLATGLOB:
#- "*_CDNS_*"
#- "*$$*"
#- "M1_N*"
#- "M1_P*"
#- "M2_M1*"
#- "M3_M2*"
#- "nmos_5p0*"
#- "nmos_1p2*"
#- "pmos_5p0*"
#- "pmos_1p2*"
#- "via1_*"
#- "ypass_gate*"
#- "G_ring_*"
#- "dcap_103*"
#- "din_*"
#- "mux821_*"
#- "rdummy_*"
#- "pmoscap_*"
#- "xdec_*"
#- "ypredec*"
#- "xpredec*"
#- "prexdec_*"
#- "xdec8_*"
#- "xdec16_*"
#- "xdec32_*"
#- "sa_*"
RT_MIN_LAYER: Metal3
RT_MAX_LAYER: Metal5
ROUTING_CORES: 12
GRT_ALLOW_CONGESTION: true

# --- Analog Macro Instantiation ---
MACROS:
  neurona_lvs:

    gds:
      - /foss/designs/libs/snn_analog/lif/neurona_lvs.gds
    lef:
      - /foss/designs/libs/snn_analog/lif/neurona_lvs.lef
    
    spice:
      - /foss/designs/libs/snn_analog/lif/neurona_lvs.spice
    vh:
      - /foss/designs/libs/snn_analog/lif/neurona_lvs.v
    lib:
      "*":
        - /foss/designs/libs/snn_analog/lif/neurona_lvs.lib
    instances:
      x1:
        location: [20, 30]
        orientation: N
      x2:
        location: [20, 130]
        orientation: N
      x3:
        location: [20, 230]
        orientation: N
      x4:
        location: [20, 330]
        orientation: N
