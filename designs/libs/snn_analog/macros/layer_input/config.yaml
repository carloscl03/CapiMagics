meta:
  version: 3
  flow: Classic

DESIGN_NAME: layer_input

VERILOG_FILES:
  - dir::layer_input.v

# --- Parámetros de Floorplaning ---
FP_SIZING: absolute
DIE_AREA:
  - 0
  - 0
  - 142
  - 82
CORE_AREA:
  - 5
  - 5
  - 137
  - 77

# --- Alimentación y Potencia ---
VDD_NETS:
  - avdd
  - VDD
GND_NETS:
  - avss
  - VSS

# --- Conexiones de Potencia para los Macros ---
# Mapea las redes de alimentación del diseño (avdd/avss) a los pines del LEF (Vdd/Vss)
PDN_MACRO_CONNECTIONS:
  - "x.* avdd avss Vdd Vss"

# --- Desactivar Optimización y Reparación de Celdas Estándar Temporal en lo que arreglan lo de los capacitores :/, Esto se deberia de cambiar a true cuando se tenga cada uno de los parametros conectado a cada uno de sus pines, debido a que no se encuentran, esto se debe que libreline lo quiere reparar para llegar al vdd del elemento, pero como no existe da error, para evitar eso se desactivo temporalmente para seguir con el flujo lo mas deseado posible y observar que todo funciona correctamente---

#A evaluar 
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_REPAIR_DESIGN: false

#forzoso mantener desactivado 
RUN_CTS: false
##

# --- Reglas de Enrutamiento y Capas (GF180MCU) ---
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
RT_MIN_LAYER: Metal3
RT_MAX_LAYER: Metal5
ROUTING_CORES: 12
GRT_ALLOW_CONGESTION: true

# --- Halo y Espaciado de Macros ---
FP_MACRO_HORIZONTAL_HALO: 2
FP_MACRO_VERTICAL_HALO: 2

# --- Definición de Macros Analógicos ---
MACROS:
  neurona_lvs:
    gds:
      - dir::../../lif/neurona_lvs.gds
    lef:
      - dir::../../lif/neurona_lvs.lef
    spice:
      - dir::../../lif/neurona_lvs.spice
    vh:
      - dir::../../lif/neurona_lvs.v
    instances:
      x1:
        location:
          - 10
          - 10
        orientation: N
      x2:
        location:
          - 73
          - 10
        orientation: N
      x3:
        location:
          - 10
          - 43
        orientation: N
      x4:
        location:
          - 73
          - 43
        orientation: N
