meta:
  version: 3
  flow: Classic

DESIGN_NAME: stdp_4x2

# --- RTL del top ---
VERILOG_FILES:
  - dir::stdp_4x2.v
  - dir::../../stdp/stdp.v

# --- Floorplaning ---
FP_SIZING: absolute
DIE_AREA:
  - 0
  - 0
  - 225
  - 255

# --- Alimentación y Potencia ---
VDD_NETS:
  - avdd
GND_NETS:
  - avss
  

TOP_MARGIN_MULT: 2
BOTTOM_MARGIN_MULT: 2
LEFT_MARGIN_MULT: 2
RIGHT_MARGIN_MULT: 2

IO_PIN_ORDER_CFG: dir::pin.cfg
IGNORE_DISCONNECTED_MODULES:
  - stdp

# STD_CELL_LIBRARY: "gf180mcu_fd_sc_mcu7t5v0"

# --- Manejo de Verificaciones para Diseños Analógicos / Macros ---
ERROR_ON_LINTER_ERRORS: false
ERROR_ON_LINTER_WARNINGS: false
ERROR_ON_UNMAPPED_CELLS: false
ERROR_ON_SYNTH_CHECKS: false
ERROR_ON_NL_ASSIGN_STATEMENTS: false
ERROR_ON_PDN_VIOLATIONS: false

# ---- FLAGS PDN
PDN_ENABLE_RAILS: false
PDN_MULTILAYER: true
PDN_VWIDTH: 2.0
PDN_HWIDTH: 2.0
PDN_VSPACING: 2.0
PDN_HSPACING: 2.0

PDN_VPITCH: 101.0
PDN_HPITCH: 55.0

PDN_VOFFSET: 10
PDN_HOFFSET: 20.5


PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 2.0
PDN_CORE_RING_HWIDTH: 2.0
PDN_CORE_RING_VSPACING: 1.5
PDN_CORE_RING_HSPACING: 1.5


# Conexión de alimentación a cada macro
PDN_MACRO_CONNECTIONS:
  - "x1 avdd avss avdd avss"
  - "x2 avdd avss avdd avss"
  - "x3 avdd avss avdd avss"
  - "x4 avdd avss avdd avss"
  - "x5 avdd avss avdd avss"
  - "x6 avdd avss avdd avss"
  - "x7 avdd avss avdd avss"
  - "x8 avdd avss avdd avss"
  - "x9 avdd avss avdd avss"
  - "x10 avdd avss avdd avss"

# --- Optimizaciones para Macros / Desactivación de Diodos Antenna ---
PL_TIMING_DRIVEN: false
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false
RUN_HEURISTIC_DIODE_INSERTION: false
RUN_ANTENNA_REPAIR: false
# GRT_ANTENNA_ITERS: 5
#GRT_ANTENNA_MARGIN: 0
RUN_FILL_INSERTION: false
RUN_TAP_ENDCAP_INSERTION: false
RUN_IRDROP_REPORT: false

# --- Direct LEF/GDS Blackbox Include ---
EXTRA_LEFS:
  - /foss/designs/libs/snn_analog/stdp/stdp.lef
  - /foss/designs/libs/snn_analog/Current_limit/Current_limit.lef
EXTRA_GDS:
  - /foss/designs/libs/snn_analog/stdp/stdp.gds
  - /foss/designs/libs/snn_analog/Current_limit/Current_limit.gds

# --- Routing (GF180MCU) ---
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
MAGIC_ZEROIZE_ORIGIN: false
ERROR_ON_MAGIC_DRC: false
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: false
MAGIC_EXT_UNIQUE: notopports

RT_MIN_LAYER: Metal3
RT_MAX_LAYER: Metal5
DRT_THREADS: 12
GRT_ALLOW_CONGESTION: true
GRT_MACRO_EXTENSION: 0.5

# --- Definición de Macros Analógicos ---
MACROS:
  stdp:
    # "ROUTING_OBSTRUCTIONS": [
    #     ["metal5", 61.58, 25.95, 68.58, 40.35],
    #     ["metal4", 61.58, 25.95, 68.58, 40.35],
    #     ["metal5", 71.68, 20.05, 78.58, 34.35],
    #     ["metal4", 71.68, 20.05, 78.58, 34.35],
    #     ["metal5", 81.68, 3.1, 96.08, 39.7],
    #     ["metal4", 81.68, 3.1, 96.08, 39.7],
    # ]
    gds:
      - dir::../../stdp/stdp.gds
    lef:
      - dir::../../stdp/stdp.lef
    spice:
      - dir::../../stdp/stdp.spice
    vh:
      - dir::../../stdp/stdp.v
    instances:
      x1:
        location: [10, 201]
        orientation: N
      x2:
        location: [10, 145]
        orientation: N
      x3:
        location: [10, 90]
        orientation: N
      x4:
        location: [10, 35]
        orientation: N
#-----------------------------------------        
      x5:
        location: [110, 201]
        orientation: N
      x6:
        location: [110, 145]
        orientation: N
      x7:
        location: [110, 90]
        orientation: N
      x8:
        location: [110, 35]
        orientation: N

  Current_limit:
    gds:
      - dir::../../Current_limit/Current_limit.gds
    lef:
      - dir::../../Current_limit/Current_limit.lef
    spice:
      - dir::../../Current_limit/Current_limit.spice
    vh:
      - dir::../../Current_limit/Current_limit.v
    instances:
      x9:
        location: [94, 3]
        orientation: N
      x10:
        location: [195, 3]
        orientation: N
